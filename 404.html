<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa bulunamadı · Seite nicht gefunden | Derya Kılıç</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#faf6f0">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/fontawesome.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        .nf { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; text-align: center;
              background: radial-gradient(circle at 20% 15%, var(--sand), transparent 55%), var(--cream); }
        .nf-card { max-width: 560px; }
        .nf-logo { width: 84px; height: auto; margin: 0 auto 10px; display: block; }
        .nf-code { font-family: var(--font-display); font-size: clamp(4rem, 14vw, 6.5rem); line-height: 1; color: var(--taupe); margin: 0; }
        .nf h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin: 6px 0 14px; }
        .nf-langs { display: grid; gap: 6px; color: var(--muted); margin: 0 0 26px; }
        .nf-langs p { margin: 0; }
        .nf-langs small { font-weight: 700; letter-spacing: .14em; color: var(--taupe); margin-right: 6px; font-size: .72rem; }
        .nf-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
    <main class="nf">
        <div class="nf-card">
            <img class="nf-logo" src="/logobaum.png" alt="Derya Kılıç" width="84" height="85">
            <p class="nf-code">404</p>
            <h1>Sayfa bulunamadı</h1>
            <div class="nf-langs">
                <p><small>TR</small>Aradığınız sayfa taşınmış veya mevcut değil.</p>
                <p><small>DE</small>Die gesuchte Seite wurde verschoben oder existiert nicht.</p>
                <p><small>EN</small>The page you are looking for has moved or does not exist.</p>
            </div>
            <div class="nf-actions">
                <a class="btn btn--primary" href="/"><i class="fas fa-house"></i> Ana Sayfa · Startseite</a>
                <a class="btn btn--ghost" href="/kalender.html"><i class="fas fa-calendar-check"></i> Randevu Al</a>
                <a class="btn btn--ghost" href="/portal.html"><i class="fas fa-user-lock"></i> Portal</a>
            </div>
        </div>
    </main>
</body>
</html>
